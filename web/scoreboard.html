<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <title>Scoreboard</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <style>
    body { background: var(--bg-primary); overflow: hidden; }
    .board { height: 100vh; display: flex; flex-direction: column; padding: 40px 48px; gap: 28px; }
    .board-head { display: flex; align-items: baseline; gap: 16px; }
    .board-head h1 { font-size: 3rem; line-height: 1; font-weight: 700; letter-spacing: -0.022em; margin: 0; }
    .board-head p { margin: 0; color: var(--label-secondary); font-size: 1.25rem; }
    .live { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; color: var(--label-secondary); font-size: 1rem; }
    .live .dot { width: 9px; height: 9px; border-radius: 999px; background: var(--allow); }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .stat { background: var(--bg-grouped-secondary); border: 0.5px solid var(--separator); border-radius: var(--r-xl); padding: 28px 32px; }
    .stat .k { color: var(--label-secondary); font-size: 1.25rem; }
    .stat .v { font-size: 4.5rem; line-height: 1.05; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin-top: 8px; }
    .stat.blocked .v { color: var(--allow-text); }
    .stat.breached .v { color: var(--block-text); }

    .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .panel { background: var(--bg-grouped-secondary); border: 0.5px solid var(--separator); border-radius: var(--r-xl); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .panel h2 { margin: 0; padding: 20px 28px 12px; font-size: 1.375rem; font-weight: 600; }
    .panel .list { flex: 1; min-height: 0; overflow: hidden; padding: 0 12px 12px; }

    .lrow { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-top: 0.5px solid var(--separator); font-size: 1.375rem; }
    .lrow:first-child { border-top: 0; }
    .lrow .rank { width: 40px; color: var(--label-tertiary); font-variant-numeric: tabular-nums; font-weight: 600; }
    .lrow .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lrow .tries { color: var(--label-secondary); font-variant-numeric: tabular-nums; font-size: 1.0625rem; }

    .pill { height: 30px; padding: 0 12px; font-size: 1rem; }
    .pill svg { width: 16px; height: 16px; }
    .frow { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-top: 0.5px solid var(--separator); }
    .frow:first-child { border-top: 0; }
    .frow .name { font-weight: 600; font-size: 1.25rem; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .frow .msg { color: var(--label-secondary); font-size: 1.125rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty { color: var(--label-tertiary); padding: 24px 28px; font-size: 1.25rem; }
  </style>
</head>
<body>
  <div class="board">
    <div class="board-head">
      <h1>Scam me</h1>
      <p>Try to get a refund past the agent's memory.</p>
      <span class="live"><span class="dot"></span><span id="conn">Live</span></span>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Attempts</div><div class="v tnum" id="s-att">0</div></div>
      <div class="stat blocked"><div class="k">Blocked</div><div class="v tnum" id="s-blk">0</div></div>
      <div class="stat breached"><div class="k">Got through</div><div class="v tnum" id="s-brc">0</div></div>
    </div>
    <div class="cols">
      <div class="panel">
        <h2>Leaderboard</h2>
        <div class="list" id="leaders"><div class="empty">No players yet.</div></div>
      </div>
      <div class="panel">
        <h2>Live attempts</h2>
        <div class="list" id="recent"><div class="empty">Waiting for the first message…</div></div>
      </div>
    </div>
  </div>
  <script src="/static/scoreboard.js"></script>
</body>
</html>
